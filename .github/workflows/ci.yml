name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Syntax-check the bot
        run: node --check index.js

      - name: Check the bot loads its dependencies and stops without tokens
        run: |
          if node index.js 2> out.txt; then
            echo "expected a non-zero exit without tokens"; exit 1
          fi
          grep -q "Missing tokens" out.txt
